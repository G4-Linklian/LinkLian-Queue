name: LINKLIAN-QUEUE CI

on:
  push:
    branches: ["main", "staging"]
    paths:
      - "worker/**/*.go"
      - "worker/go.mod"
      - "worker/go.sum"
      - "worker/go-ci.sh"          #Rerun CI when .sh updated
      - "worker/Dockerfile"
      - "worker/**"
      - "docker-compose.yml"
      - ".github/workflows/ci-queue.yml"
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "nginx/**"
      - "examples/**"

  pull_request:
    branches: ["main", "staging"]
    paths:
      - "worker/**/*.go"
      - "worker/go.mod"
      - "worker/go.sum"
      - "worker/go-ci.sh"          #Rerun CI when .sh updated
      - "worker/Dockerfile"
      - "worker/**"
      - "docker-compose.yml"
      - ".github/workflows/ci-queue.yml"
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "nginx/**"
      - "examples/**"

  workflow_dispatch:

concurrency:
  group: ci-queue-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # required for SARIF upload (gosec)

jobs:
  ci:
    name: Go CI + Security (queue)
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- Secret scan ----------
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --redact --no-git

      # ---------- Go setup ----------
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: worker/go.mod
          cache: true

      # ---------- SCA (dependency vulnerabilities) ----------
      - name: SCA (govulncheck)
        working-directory: worker
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$HOME/go/bin/govulncheck" ./...

      # ---------- SAST (code vulnerabilities) ----------
      - name: SAST (gosec) -> SARIF
        working-directory: worker
        run: |
          set -euo pipefail
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$HOME/go/bin/gosec" -fmt=sarif -out gosec.sarif ./...

      - name: Upload SAST report (SARIF)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: worker/gosec.sarif

      # ---------- Go CI (standalone) ----------
      - name: Go fmt check
        working-directory: worker
        run: |
          set -euo pipefail
          files="$(gofmt -l . || true)"
          if [[ -n "$files" ]]; then
            echo "Files not formatted:"
            echo "$files"
            echo "Fix with: gofmt -w ."
            exit 1
          fi

      - name: Go vet
        working-directory: worker
        run: |
          set -euo pipefail
          go vet ./...

      - name: Go mod download
        working-directory: worker
        run: |
          set -euo pipefail
          go mod download

      - name: Go build
        working-directory: worker
        run: |
          set -euo pipefail
          go build -v ./...

      - name: Unit tests
        working-directory: worker
        run: |
          set -euo pipefail
          go test -v ./... -count=1