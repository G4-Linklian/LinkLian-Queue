name: LINKLIAN-QUEUE Full CI & CodeScene

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform-build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Project
        run: go build -v ./...

  integration-tests:
    name: Integration Tests (Postgres & RabbitMQ)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: linklian_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d linklian_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Tests with Env
        env:
          DATABASE_URL: postgres://user:password@localhost:5432/linklian_db?sslmode=disable
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
        run: |
          go test -v ./...
          # ถ้าแยก integration ด้วย tag ให้ใช้บรรทัดนี้แทน:
          # go test -v -tags=integration ./...

