name: LINKLIAN-QUEUE CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: worker/go.mod
          cache: true

      - name: Fetch shared CI script
        working-directory: worker
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/<ORG>/<CI-REPO>/<COMMIT_SHA>/scripts/go-ci.sh \
            -o go-ci.sh
          chmod +x go-ci.sh

      - name: Run Unit CI
        working-directory: worker
        run: ./go-ci.sh unit

  integration:
    needs: [unit]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: linklian_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U user -d linklian_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management
        ports: ["5672:5672", "15672:15672"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: worker/go.mod
          cache: true

      - name: Fetch shared CI script
        working-directory: worker
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/<ORG>/<CI-REPO>/<COMMIT_SHA>/scripts/go-ci.sh \
            -o go-ci.sh
          chmod +x go-ci.sh

      - name: Run Integration CI
        working-directory: worker
        env:
          DATABASE_URL: postgres://user:password@localhost:5432/linklian_db?sslmode=disable
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
        run: ./go-ci.sh integration

