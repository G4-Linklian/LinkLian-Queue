name: LINKLIAN-QUEUE CI

# Trigger this workflow on push and pull requests to main/staging branches
# Only trigger when relevant files are changed (worker Go code, config, Docker, CI workflow)
on:
  push:
    branches: ["main", "staging"]
    paths:
      - "worker/**/*.go"
      - "worker/go.mod"
      - "worker/go.sum"
      - "worker/go-ci.sh"
      - "worker/Dockerfile"
      - "worker/**"
      - "docker-compose.yml"
      - ".github/workflows/ci-queue.yml"
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "nginx/**"
      - "examples/**"

  pull_request:
    branches: ["main", "staging"]
    paths:
      - "worker/**/*.go"
      - "worker/go.mod"
      - "worker/go.sum"
      - "worker/go-ci.sh"
      - "worker/Dockerfile"
      - "worker/**"
      - "docker-compose.yml"
      - ".github/workflows/ci-queue.yml"
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "nginx/**"
      - "examples/**"

  workflow_dispatch:

# Prevent multiple workflow runs on the same branch
# If a new push happens before previous run finishes, cancel the old one
concurrency:
  group: ci-queue-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Main CI job: Run Go checks/tests/build
  ci:
    name: Go CI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Test on Linux, macOS, and Windows to ensure cross-platform compatibility
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      # Fetch the repository code
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Go environment from version specified in worker/go.mod
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: worker/go.mod
          cache: true
  
      - name: Make script executable (non-windows)
        if: runner.os != 'Windows'
        working-directory: worker
        run: chmod +x ./go-ci.sh

      # Run Go code quality checks: formatting, vetting, tests, build (UNIT ONLY)
      - name: Run Go CI (gofmt/vet/test/build)
        working-directory: worker
        shell: bash
        run: |
          chmod +x ./go-ci.sh
          ./go-ci.sh unit
