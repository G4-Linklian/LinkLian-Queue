name: LINKLIAN-QUEUE CI

on:
  pull_request:
    branches: [main, staging]
    paths:
      - "**"
  workflow_dispatch:

concurrency:
  group: ci-queue-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  sast:
    name: SAST (gosec)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Detect go.mod
        id: gomod
        run: |
          set -euo pipefail
          path="$(git ls-files '**/go.mod' | head -n 1 || true)"
          if [[ -z "$path" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "dir=$(dirname "$path")" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        if: ${{ steps.gomod.outputs.found == 'true' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ steps.gomod.outputs.path }}
          cache: true
          cache-dependency-path: ${{ steps.gomod.outputs.dir }}/go.sum

      - name: Run gosec (SARIF)
        if: ${{ steps.gomod.outputs.found == 'true' }}
        continue-on-error: true
        working-directory: ${{ steps.gomod.outputs.dir }}
        run: |
          set -euo pipefail
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$HOME/go/bin/gosec" -fmt=sarif -out "$GITHUB_WORKSPACE/gosec.sarif" ./...

      - name: Upload gosec SARIF
        if: ${{ always() && hashFiles('gosec.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif

      - name: No go.mod found
        if: ${{ steps.gomod.outputs.found != 'true' }}
        run: echo "::warning::No go.mod found in repository. Skipping gosec."

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    needs: [sast]

    steps:
      - uses: actions/checkout@v4

      - name: Run Gitleaks (SARIF)
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest \
            detect \
              --source=/repo \
              --redact \
              --verbose \
              --report-format=sarif \
              --report-path=/repo/gitleaks.sarif \
              --exit-code 1

      - name: Upload Gitleaks SARIF
        if: ${{ always() && hashFiles('gitleaks.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [secret-scan]

    steps:
      - uses: actions/checkout@v4

      - name: Detect go.mod
        id: gomod
        run: |
          set -euo pipefail
          path="$(git ls-files '**/go.mod' | head -n 1 || true)"
          if [[ -z "$path" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "dir=$(dirname "$path")" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        if: ${{ steps.gomod.outputs.found == 'true' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ steps.gomod.outputs.path }}
          cache: true
          cache-dependency-path: ${{ steps.gomod.outputs.dir }}/go.sum

      - name: Go fmt check (non-blocking)
        if: ${{ steps.gomod.outputs.found == 'true' }}
        continue-on-error: true
        working-directory: ${{ steps.gomod.outputs.dir }}
        run: |
          files="$(gofmt -l . || true)"
          if [[ -n "$files" ]]; then
            for f in $files; do
              echo "::warning file=$f::File not formatted (run: gofmt -w .)"
            done
            exit 1
          fi

      - name: Go vet
        if: ${{ steps.gomod.outputs.found == 'true' }}
        working-directory: ${{ steps.gomod.outputs.dir }}
        run: go vet ./...

      - name: Go mod download
        if: ${{ steps.gomod.outputs.found == 'true' }}
        working-directory: ${{ steps.gomod.outputs.dir }}
        run: go mod download

      - name: Go build
        if: ${{ steps.gomod.outputs.found == 'true' }}
        working-directory: ${{ steps.gomod.outputs.dir }}
        run: go build -v ./...

      - name: No go.mod found
        if: ${{ steps.gomod.outputs.found != 'true' }}
        run: echo "::warning::No go.mod found in repository. Skipping Go build."

  container-scan:
    name: Docker Build + Trivy
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Detect Dockerfile
        id: dockerfile
        run: |
          set -euo pipefail
          df="$(git ls-files '**/Dockerfile' | head -n 1 || true)"
          if [[ -z "$df" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "path=$df" >> "$GITHUB_OUTPUT"
          echo "context=$(dirname "$df")" >> "$GITHUB_OUTPUT"

      - name: Build image
        if: ${{ steps.dockerfile.outputs.found == 'true' }}
        run: |
          set -euo pipefail
          docker build \
            -t linklian-queue:local \
            -f "${{ steps.dockerfile.outputs.path }}" \
            "${{ steps.dockerfile.outputs.context }}"

      - name: Trivy scan (SARIF)
        if: ${{ steps.dockerfile.outputs.found == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/repo" \
            aquasec/trivy image \
            --format sarif \
            --output /repo/trivy.sarif \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            linklian-queue:local

      - name: Upload Trivy SARIF
        if: ${{ always() && hashFiles('trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif

      - name: No Dockerfile found
        if: ${{ steps.dockerfile.outputs.found != 'true' }}
        run: echo "::warning::No Dockerfile found in repository. Skipping Docker build + Trivy."