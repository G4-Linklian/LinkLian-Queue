name: LINKLIAN-QUEUE CI

on:
  push:
    branches: ["main", "staging"]
    paths:
      - "worker/**/*.go"
      - "worker/go.mod"
      - "worker/go.sum"
      - "worker/go-ci.sh"
      - "worker/Dockerfile"
      - "worker/**"
      - "docker-compose.yml"
      - ".github/workflows/ci-queue.yml"
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "nginx/**"
      - "examples/**"

  pull_request:
    branches: ["main", "staging"]
    paths:
      - "worker/**/*.go"
      - "worker/go.mod"
      - "worker/go.sum"
      - "worker/go-ci.sh"
      - "worker/Dockerfile"
      - "worker/**"
      - "docker-compose.yml"
      - ".github/workflows/ci-queue.yml"
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "nginx/**"
      - "examples/**"

  workflow_dispatch:

concurrency:
  group: ci-queue-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Go CI (linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: worker/go.mod
          cache: true

      - name: Make script executable
        working-directory: worker
        run: chmod +x ./go-ci.sh

      - name: Run Go CI (unit only)
        working-directory: worker
        shell: bash
        run: |
          ./go-ci.sh unit
