<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkLian — Notification POC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 { font-size: 18px; font-weight: 600; color: #f1f5f9; }
    header span { font-size: 13px; color: #64748b; }

    #status-badge {
      margin-left: auto;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      background: #1e3a2f;
      color: #4ade80;
      border: 1px solid #166534;
      transition: all 0.2s;
    }
    #status-badge.disconnected {
      background: #3b1c1c;
      color: #f87171;
      border-color: #7f1d1d;
    }
    #status-badge.connecting {
      background: #2d2a1e;
      color: #facc15;
      border-color: #713f12;
    }

    main {
      display: flex;
      flex: 1;
      gap: 0;
    }

    /* ── Left panel: config ── */
    .config-panel {
      width: 300px;
      min-width: 300px;
      background: #1e293b;
      border-right: 1px solid #334155;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .config-panel h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
    }

    label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 10px;
      color: #e2e8f0;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #6366f1; }

    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-danger  { background: #ef4444; color: #fff; }
    .btn-ghost   { background: #334155; color: #e2e8f0; }

    .divider { border: none; border-top: 1px solid #334155; }

    /* ── Right panel: feed ── */
    .feed-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .feed-toolbar {
      padding: 12px 20px;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0f172a;
    }

    .feed-toolbar h2 { font-size: 14px; font-weight: 600; flex: 1; }

    #unread-badge {
      background: #6366f1;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 9999px;
      display: none;
    }

    #notification-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .noti-item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px 16px;
      position: relative;
      animation: slideIn 0.2s ease;
    }
    .noti-item.unread { border-left: 3px solid #6366f1; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .noti-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .noti-type-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-community    { background: #164e63; color: #67e8f9; }
    .badge-feed         { background: #1e3a5f; color: #93c5fd; }
    .badge-chat         { background: #1a2e1a; color: #86efac; }
    .badge-notification { background: #2d1b69; color: #c4b5fd; }

    .noti-title {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
      flex: 1;
    }

    .noti-time {
      font-size: 11px;
      color: #64748b;
      margin-left: auto;
    }

    .noti-body { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }

    .noti-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .meta-chip {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #0f172a;
      color: #64748b;
      border: 1px solid #334155;
    }

    .raw-json {
      margin-top: 8px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      color: #64748b;
      font-family: 'Courier New', monospace;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
    }

    .toggle-raw {
      font-size: 11px;
      color: #6366f1;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      margin-top: 4px;
    }
    .toggle-raw:hover { text-decoration: underline; }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #475569;
      gap: 8px;
    }
    .empty-state svg { opacity: 0.3; }
    .empty-state p { font-size: 14px; }

    /* ── Log panel ── */
    .log-panel {
      height: 160px;
      background: #020617;
      border-top: 1px solid #1e293b;
      padding: 10px 20px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #475569;
    }

    .log-entry { margin-bottom: 2px; }
    .log-entry.info  { color: #64748b; }
    .log-entry.ok    { color: #4ade80; }
    .log-entry.warn  { color: #facc15; }
    .log-entry.error { color: #f87171; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
    <rect width="28" height="28" rx="8" fill="#6366f1"/>
    <path d="M7 14a7 7 0 0 1 14 0" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="14" cy="14" r="3" fill="#fff"/>
  </svg>
  <h1>LinkLian Notification POC</h1>
  <span>WebSocket Client</span>
  <div id="status-badge" class="disconnected">● Disconnected</div>
</header>

<main>
  <!-- Config -->
  <aside class="config-panel">
    <h2>Connection</h2>

    <div>
      <label>WebSocket URL</label>
      <input type="text" id="ws-url" value="ws://localhost:8080/ws/noti" />
    </div>
    <div>
      <label>User ID (receive_user_id)</label>
      <input type="number" id="user-id" value="1" min="1" />
    </div>
    <div>
      <label>JWT Token</label>
      <input type="text" id="jwt-token" placeholder="eyJhbGci..." />
    </div>

    <button class="btn btn-primary" onclick="connect()">Connect</button>
    <button class="btn btn-danger"  onclick="disconnect()">Disconnect</button>

    <hr class="divider"/>

    <h2>Filter</h2>
    <div>
      <label>ref_type</label>
      <input type="text" id="filter-ref-type" placeholder="เช่น community-post" />
    </div>

    <hr class="divider"/>

    <h2>Actions</h2>
    <button class="btn btn-ghost" onclick="clearList()">Clear notifications</button>
    <button class="btn btn-ghost" onclick="clearLog()">Clear log</button>
  </aside>

  <!-- Feed -->
  <section class="feed-panel">
    <div class="feed-toolbar">
      <h2>Notifications</h2>
      <span id="unread-badge">0</span>
      <button class="btn btn-ghost" style="width:auto;padding:6px 12px;" onclick="markAllRead()">Mark all read</button>
    </div>

    <div id="notification-list">
      <div class="empty-state" id="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <p>No notifications yet</p>
        <p style="font-size:12px">Connect and wait for events</p>
      </div>
    </div>

    <div class="log-panel" id="log-panel">
      <div class="log-entry info">[system] Notification POC ready. Configure connection and click Connect.</div>
    </div>
  </section>
</main>

<script>
  let ws = null;
  let unreadCount = 0;
  const notifications = [];

  // ── WebSocket ──────────────────────────────────────────────────────────────

  function connect() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      log('warn', 'Already connected');
      return;
    }

    const url      = document.getElementById('ws-url').value.trim();
    const userId   = document.getElementById('user-id').value.trim();
    const token    = document.getElementById('jwt-token').value.trim();

    if (!url) { log('error', 'WebSocket URL is required'); return; }

    // Append query params
    const fullUrl = buildUrl(url, userId, token);
    log('info', `Connecting to ${fullUrl} …`);
    setStatus('connecting');

    try {
      ws = new WebSocket(fullUrl);
    } catch (e) {
      log('error', `Failed to create WebSocket: ${e.message}`);
      setStatus('disconnected');
      return;
    }

    ws.onopen = () => {
      log('ok', 'Connected');
      setStatus('connected');
    };

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        handleMessage(data);
      } catch (e) {
        log('warn', `Non-JSON message: ${event.data}`);
      }
    };

    ws.onerror = (err) => {
      log('error', 'WebSocket error');
      setStatus('disconnected');
    };

    ws.onclose = (e) => {
      log('warn', `Disconnected (code ${e.code})`);
      setStatus('disconnected');
      ws = null;
    };
  }

  function disconnect() {
    if (ws) {
      ws.close();
      ws = null;
    }
  }

  function buildUrl(base, userId, token) {
    const params = new URLSearchParams();
    if (userId) params.set('user_id', userId);
    if (token)  params.set('token', token);
    const qs = params.toString();
    return qs ? `${base}?${qs}` : base;
  }

  // ── Message Handler ────────────────────────────────────────────────────────

  function handleMessage(data) {
    log('ok', `Received: ${data.type}`);

    const filterRef = document.getElementById('filter-ref-type').value.trim();

    if (data.type === 'NOTIFICATION') {
      const p = data.payload || {};

      // filter
      if (filterRef && p.ref_type !== filterRef) {
        log('info', `Filtered out (ref_type=${p.ref_type})`);
        return;
      }

      const userId = document.getElementById('user-id').value.trim();
      if (p.receive_user_id && p.receive_user_id !== userId) {
        log('info', `Skipped (for user ${p.receive_user_id}, I am ${userId})`);
        return;
      }

      addNotification({
        id: p.notification_id || Date.now(),
        type: 'notification',
        ref_type: p.ref_type || '—',
        title: p.title || '(no title)',
        body: p.body || '',
        actor: p.actor_name || '—',
        ref_id: p.ref_id || '—',
        raw: data,
        unread: true,
        ts: new Date(),
      });
    } else {
      // generic event (CHAT etc.)
      addNotification({
        id: Date.now(),
        type: data.type?.toLowerCase() || 'event',
        ref_type: data.payload?.ref_type || data.type || '—',
        title: data.payload?.title || data.type || 'Event',
        body: data.payload?.body || JSON.stringify(data.payload || {}),
        actor: data.payload?.actor_name || '—',
        ref_id: data.payload?.ref_id || '—',
        raw: data,
        unread: true,
        ts: new Date(),
      });
    }
  }

  // ── Notification List ──────────────────────────────────────────────────────

  function addNotification(noti) {
    notifications.unshift(noti);
    unreadCount++;
    updateUnreadBadge();
    renderNotification(noti, true);
    document.getElementById('empty-state').style.display = 'none';
  }

  function renderNotification(noti, prepend) {
    const list = document.getElementById('notification-list');
    const emptyState = document.getElementById('empty-state');

    const el = document.createElement('div');
    el.className = `noti-item${noti.unread ? ' unread' : ''}`;
    el.id = `noti-${noti.id}`;

    const badgeClass = getBadgeClass(noti.ref_type);
    const timeStr = noti.ts.toLocaleTimeString('th-TH');

    el.innerHTML = `
      <div class="noti-header">
        <span class="noti-type-badge ${badgeClass}">${escHtml(noti.ref_type)}</span>
        <span class="noti-title">${escHtml(noti.title)}</span>
        <span class="noti-time">${timeStr}</span>
      </div>
      <div class="noti-body">${escHtml(noti.body)}</div>
      <div class="noti-meta">
        <span class="meta-chip">actor: ${escHtml(noti.actor)}</span>
        <span class="meta-chip">ref_id: ${escHtml(String(noti.ref_id))}</span>
        <span class="meta-chip">noti_id: ${escHtml(String(noti.id))}</span>
      </div>
      <button class="toggle-raw" onclick="toggleRaw('${noti.id}')">Show raw JSON</button>
      <pre class="raw-json" id="raw-${noti.id}">${escHtml(JSON.stringify(noti.raw, null, 2))}</pre>
    `;

    if (prepend && emptyState.nextSibling) {
      list.insertBefore(el, emptyState.nextSibling);
    } else if (prepend) {
      list.appendChild(el);
    } else {
      list.appendChild(el);
    }
  }

  function toggleRaw(id) {
    const pre = document.getElementById(`raw-${id}`);
    const btn = pre.previousElementSibling;
    if (pre.style.display === 'block') {
      pre.style.display = 'none';
      btn.textContent = 'Show raw JSON';
    } else {
      pre.style.display = 'block';
      btn.textContent = 'Hide raw JSON';
    }
  }

  function getBadgeClass(refType) {
    if (!refType) return 'badge-notification';
    if (refType.includes('community')) return 'badge-community';
    if (refType.includes('feed') || refType.includes('post')) return 'badge-feed';
    if (refType.includes('chat')) return 'badge-chat';
    return 'badge-notification';
  }

  function markAllRead() {
    unreadCount = 0;
    updateUnreadBadge();
    document.querySelectorAll('.noti-item.unread').forEach(el => el.classList.remove('unread'));
    notifications.forEach(n => n.unread = false);
  }

  function clearList() {
    notifications.length = 0;
    unreadCount = 0;
    updateUnreadBadge();
    const list = document.getElementById('notification-list');
    list.innerHTML = '';
    const emptyState = document.createElement('div');
    emptyState.className = 'empty-state';
    emptyState.id = 'empty-state';
    emptyState.innerHTML = `
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <p>No notifications yet</p>
      <p style="font-size:12px">Connect and wait for events</p>
    `;
    list.appendChild(emptyState);
  }

  function updateUnreadBadge() {
    const badge = document.getElementById('unread-badge');
    if (unreadCount > 0) {
      badge.style.display = 'inline-block';
      badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
    } else {
      badge.style.display = 'none';
    }
  }

  // ── Log ───────────────────────────────────────────────────────────────────

  function log(level, msg) {
    const panel = document.getElementById('log-panel');
    const time = new Date().toLocaleTimeString('th-TH');
    const el = document.createElement('div');
    el.className = `log-entry ${level}`;
    el.textContent = `[${time}] ${msg}`;
    panel.appendChild(el);
    panel.scrollTop = panel.scrollHeight;
  }

  function clearLog() {
    document.getElementById('log-panel').innerHTML = '';
  }

  // ── Status ────────────────────────────────────────────────────────────────

  function setStatus(state) {
    const badge = document.getElementById('status-badge');
    badge.className = state === 'connected' ? '' : state;
    const labels = { connected: '● Connected', disconnected: '● Disconnected', connecting: '◌ Connecting…' };
    badge.textContent = labels[state] || state;
  }

  // ── Utils ─────────────────────────────────────────────────────────────────

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
