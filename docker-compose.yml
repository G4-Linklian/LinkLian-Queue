# version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_broker
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - linklian-net

  # 2. Go Worker Service (แก้ environment ให้ชี้ไป Azure)
  worker:
    build: ./worker
    container_name: go_queue_worker
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      # - PG_SSLMODE=${PG_SSLMODE}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      - SOCKET_SERVER_URL=${SOCKET_SERVER_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - linklian-net


networks:
  linklian-net:
    external: true
